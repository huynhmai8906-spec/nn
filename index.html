  <script>
    // Iframe-safe alert polyfill for smooth, non-blocking toast notifications
    window.alert = function(msg) {
      console.log('[GoCare Notification]', msg);
      let container = document.getElementById('gocare-toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'gocare-toast-container';
        container.className = 'fixed top-5 right-5 z-[999999] flex flex-col gap-3 max-w-md pointer-events-none';
        document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-[#482816] text-[#fff8f5] border-2 border-[#C5A059] shadow-2xl rounded-2xl p-4 flex items-start gap-3 transition-all duration-300 transform translate-y-[-10px] opacity-0';
      toast.innerHTML = `
        <span class="material-symbols-outlined text-[#C5A059] text-2xl flex-shrink-0">notifications_active</span>
        <div class="flex-1 text-sm font-medium leading-relaxed whitespace-pre-line">${String(msg).replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
        <button class="text-white/60 hover:text-white p-1" onclick="this.parentElement.remove()">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-[-10px]', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    };
  </script>

    /* ENHANCED ANIMATIONS & HARDWARE ACCELERATION */
    @keyframes soundWave {
      0% { height: 6px; }
      50% { height: 26px; }
      100% { height: 10px; }
    }
    .wave-bar {
      animation: soundWave 1.2s ease-in-out infinite alternate;
      will-change: height;
      transform: translateZ(0);
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 12px rgba(197, 160, 89, 0.25), inset 0 0 10px rgba(197, 160, 89, 0.08);
      }
      50% {
        box-shadow: 0 0 24px rgba(197, 160, 89, 0.55), inset 0 0 20px rgba(197, 160, 89, 0.18);
      }
    }
    .pulse-glow {
      animation: pulseGlow 2.5s infinite ease-in-out;
      transform: translateZ(0);
    }

    @keyframes heartWarningPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6);
        border-color: #dc2626;
      }
      50% {
        box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
        border-color: #ef4444;
      }
    }
    .heart-warning-pulse {
      animation: heartWarningPulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-beam {
      animation: radarRotate 4s linear infinite;
      transform-origin: center center;
      will-change: transform;
    }

    @keyframes dashPolyline {
      to {
        stroke-dashoffset: -40;
      }
    }
    .leaflet-path-animated {
      stroke-dasharray: 8, 8;
      animation: dashPolyline 1.5s linear infinite;
    }

    @keyframes ecgBeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.12); }
      28% { transform: scale(1); }
      42% { transform: scale(1.18); }
      70% { transform: scale(1); }
    }
    .ecg-heart {
      animation: ecgBeat 1.4s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
    }

    .gold-glow-card {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
